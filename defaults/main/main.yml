---
###############################################################################
# Feature Flags
###############################################################################

# 1. Is this role applied to a container?
#
# Decision: manual user setting - There is currently no good way to
#     deterministically and consistently detect if a remote host is a
#     container outside of common cases.
#
# Special Case:
#   * deb_flg_container=true forces conan_exiles_flg_container=true.
#
# Default: False.
conan_exiles_flg_container: false

# 2. Force Static IP for client-download.steampowered.com?
#
# client-download.steampowered.com is used for internet connectivity checks and
# to download data. CDN DNS updates may break this for up to 72 hours. steamcmd
# will fail with 'Please confirm your network connection and try again.'.
#
# Enabling resolves media.steampowered.com and statically sets /etc/hosts which
# fix this specific issue. Requires conan_exiles_flg_container=false.
#
# This should ONLY be used as a one-off and not set by default as changing IP's
# will result in steamcmd breaking again in the future.
#
# Reference:
# * https://r-pufky.github.io/docs/game/steam/troubleshooting
conan_exiles_flg_cdn: false

# 3. Force Conan Exile server updates if already installed?
#
# Mods typically lag behind server updates. Modded servers may wish to disable
# updates until all mods are confirmed working. This disables updates during
# role application as well as service pre-start update checks.
#
# Default: False.
conan_exiles_flg_update: false

# 4. Set configuration files? Default: False.
conan_exiles_flg_config: false

# 5. Enable scheduled server backup?
#
# See conan_exiles_cfg_backup_*.
#
# Default: False
conan_exiles_flg_backup: false

###############################################################################
# Service
###############################################################################

# Github access token (winetricks).
#
# Unauthenticated (anonymous) API requests are heavily restricted to the sum
# total of requests to github from a given IP. Use an access token if
# receiving 403's.
#
# Classic Tokens:
# * settings > developer settings > personal access tokens (classic)
#   * notes: {LABEL APPROPRIATELY}
#   * expiration: {CUSTOM}
#   * scopes: NONE
#
# Fine-grained Tokens:
# * settings > developer settings > personal access tokens (fine-grained)
#   * token name: {LABEL APPROPRIATELY}
#   * expiration: {CUSTOM}
#   * description: {DESCRIPTIVE TEXT}
#   * resource owner: {YOUR ACCOUNT}
#   * repository access: Public Repositories (read-only)
#
# Default: '' (unauthenticated).
#
# Reference:
# * https://docs.github.com/en/authentication
conan_exiles_srv_token: ''

# Additional steamcmd options to use during app_update.
#
# Use 'validate' to checksum installed files for corruption.
#
# Default: [].
conan_exiles_srv_update_opts: []

# Server launch options.
#
# Command line options passed to dedicated server. Use only options that must
# be set for service to start. Place all other options in configuration files.
#
# Default: [].
conan_exiles_srv_launch_opts:
  - 'nosteamclient'
  - 'game'
  - 'server'
  - 'log'

###############################################################################
# Config
###############################################################################

# Conan Exiles server configuration to set.
#
# Ansible controller path to source directory (treated as a jinja2 templates
# allowing for ansible variable use). Overwrites existing
# /home/steam/conan_exiles/ConanSandbox/Saved/Config/WindowsServer/* files.
#
# Files not specified will be removed and automatically regenerated to defaults
# on server startup.
#
# Role contains two example configurations:
# * templates/default - Vanilla auto-generated server settings.
# * templates/siptah - Isle of Siptah map enable with minimal changes for PVE.
#
# conan_exiles_cfg_d: 'host_vars/conan.example.com/data/config'
#
# Default: '' (use auto-generated defaults on startup).
#
# Reference:
# * https://conanexiles.fandom.com/wiki/Dedicated_Server_Setup:_Linux_and_Wine
# * https://r-pufky.github.io/docs/games/conan_exiles
conan_exiles_cfg_d: ''

# List of mods to enable.
#
# Mods are automatically downloaded and installed. Only listed mods are
# enabled. Disk space usage is 2x mod size as mods are cached in Steam then
# staged in dedicated server.
#
# Special Case:
# * Mod list auto regenerated in specified list order.
#
# conan_exiles_cfg_mods:
#   - 2723987721
#   - 1641464108
#   - 1401061998
#   - 1716717492
#   - 864199675
#   - 2869834350
#   - 2859016366
#
# Default: [] (disabled).
conan_exiles_cfg_mods: []

# Backup
###############################################################################

# Include mod packages in backups? Default: False.
conan_exiles_cfg_backup_mods: false

# Root backup location. Default: '/srv/backup/conan_exiles'.
conan_exiles_cfg_backup_d: '/srv/backup/conan_exiles'

# Backup schedule (systemd TIME format).
#
# Default: '1d' (daily).
#
# Reference:
# * https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html
conan_exiles_cfg_backup_schedule: '1d'
