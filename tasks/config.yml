---
###############################################################################
# Config
###############################################################################
# Server will automatically populate any required .ini file if it does not
# exist on service start. Any pre-existing .ini file will not be touched and
# assumed correct.
#
# Only set configuration files if they are defined.
#
# Documentation for linux systemd services is very outdated. Checking service
# against documentation will not line up. Only check if there are new options.
#
# Filetree returns a dict (instead of a list of dict) for one element. Use
# query to guarantee a list result.
#
# Reference:
# * https://conanexiles.fandom.com/wiki/Dedicated_Server_Setup:_Linux_and_Wine

- name: 'Config | filetree | set managed directories'
  ansible.builtin.file:
    path: '{{ conan_exiles___app._ini_d ~ "/" ~ item.path }}'
    owner: '{{ steam__ctx._user }}'
    group: '{{ steam__ctx._group }}'
    mode: '0755'
    state: 'directory'
  loop: '{{ query("community.general.filetree", conan_exiles__cfg._cfg_d) }}'
  loop_control:
    label: '{{ item.path }}'
  when: item.state == 'directory'

- name: 'Config | filetree | set managed files'
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ conan_exiles___app._ini_d ~ "/" ~ item.path }}'
    owner: '{{ steam__ctx._user }}'
    group: '{{ steam__ctx._group }}'
    mode: '0644'
  loop: '{{ query("community.general.filetree", conan_exiles__cfg._cfg_d) }}'
  loop_control:
    label: '{{ item.path }}'
  when: item.state == 'file'

- name: 'Config | filesystem | query remote files'
  ansible.builtin.find:
    paths: '{{ conan_exiles___app._ini_d }}'
    file_type: 'any'
    hidden: true
    recurse: true
  register: conan_exiles__remote

- name: 'Config | filetree | remove unmanaged files and directories'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: 'absent'
  loop:
    '{{ conan_exiles__remote.files | sort(attribute="path", reverse=true) }}'
  loop_control:
    label: '{{ item.path }}'
  when: >
    item.path not in
    (
      query("community.general.filetree", conan_exiles__cfg._cfg_d) |
      map(attribute='path') |
      map('regex_replace', '^', conan_exiles___app._ini_d ~ "/") | list
    )

- name: '{{ "Config | filesystem | disable " ~ conan_exiles___app._mod_list }}'
  when: conan_exiles__cfg._mods | length == 0
  ansible.builtin.file:
    dest: '{{ conan_exiles___app._mod_list }}'
    state: 'absent'
