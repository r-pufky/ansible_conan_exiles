---
- name: 'Prep'
  ansible.builtin.import_tasks: 'prep.yml'
- name: 'Install'
  ansible.builtin.import_tasks: 'install.yml'

- name: 'Update'
  when: conan_exiles_flg_update or not conan_exiles__cfg._is_installed
  ansible.builtin.import_tasks: 'update.yml'

- name: 'Config'
  when: conan_exiles_flg_config
  ansible.builtin.import_tasks: 'config.yml'

- name: 'Backup'
  ansible.builtin.import_tasks: 'backup.yml'

- name: 'Start'
  ansible.builtin.import_tasks: 'start.yml'
