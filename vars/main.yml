---
###############################################################################
# Conan Exiles Options
###############################################################################
#
# Updates:
# * Version is determined by 'Dreamworld snapshot:' in logs.
#   * Update application, remove Saved/WindowsSettings/* - all ini defaults
#     will be regenerated on service start. Use these for defaults/config
#     updates.
# * KEEP a separate change log as changes are made.
# * Use bare-metal docs to validate package/process changes.
# * Update defaults.
# * Update tests for any changes.
# * Standard validation testing (yamllint, ansible-lint, to-do, no-qa).
#
# Reference:
# * https://conanexiles.fandom.com/wiki/Dedicated_Server_Setup:_Linux_and_Wine

conan_exiles___release: "{{ {} | r_pufky.data.v3(

    _date='2026-03-18',
    _debian='trixie',
    _app='44276',
    _app_id=443030,
    _store_id=440900,
    _platform='windows',
  ) }}"

conan_exiles___app: "{{ {} | r_pufky.data.v3(

    _root_d='/home/steam/conan_exiles',
    _ini_d=(
      '/home/steam/conan_exiles/ConanSandbox/Saved/Config/WindowsServer'
    ),
    _mod_d='/home/steam/conan_exiles/ConanSandbox/Mods',
    _mod_list='/home/steam/conan_exiles/ConanSandbox/Mods/modlist.txt',
    _workshop_d=(
      '/home/steam/conan_exiles/steamapps/workshop/content/' ~
      conan_exiles___release._store_id
    ),
    _save_d='/home/steam/conan_exiles/ConanSandbox/Saved',
    _bin=(
      '/home/steam/conan_exiles/ConanSandbox/Binaries/Win64/' ~
      'ConanSandboxServer-Win64-Shipping.exe'
    ),
    _update_server='/home/steam/conan_exiles/update_server',
    _steamcmd=(
      '/usr/games/steamcmd ' ~
      '+@sSteamCmdForcePlatformType ' ~ conan_exiles___release._platform ~
      ' +force_install_dir /home/steam/conan_exiles +login anonymous '
    ),
  ) }}"
